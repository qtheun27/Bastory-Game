<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bastory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Application installable (écran d'accueil) : plein écran + paysage -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b1d6b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/wixy.png">
</head>
<body>
    <!-- Écran de connexion / inscription -->
    <div id="auth">
      <form id="authForm">
        <h1>BASTORY</h1>
        <input id="aPseudo" placeholder="Pseudo (pour créer un compte)" maxlength="16">
        <input id="aEmail" type="email" placeholder="Email" autocomplete="username">
        <input id="aMdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
        <button type="submit">Se connecter</button>
        <button type="button" id="bInscription" class="sec">Créer un compte</button>
        <button type="button" id="bGoogle" class="google">Continuer avec Google</button>
        <div id="authErr"></div>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="profil.js"></script>
    <!-- Moteur 3D (Three.js) pour les persos 3D, avec un 2e serveur en secours -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js&quot;><\/script>')"></script>
    <script src="perso3d.js"></script>
    <script>
    // Charge la config en direct depuis Firebase, puis lance le jeu
    (async () => {
      try {
        const c = FIREBASE_CONFIG, stop = new AbortController(); setTimeout(() => stop.abort(), 4000);
        const r = await fetch(`https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents/bastory/config?key=${c.apiKey}`, { cache: 'no-store', signal: stop.signal });
        if (r.ok) window.CONFIG_DISTANTE = JSON.parse((await r.json()).fields.json.stringValue);
      } catch (e) { console.warn('Config en ligne indisponible → config.js', e); }
      const s = document.createElement('script'); s.src = 'jeu.js'; document.body.appendChild(s);
    })();
    </script>
</body>
</html>
