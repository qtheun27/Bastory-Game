<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bastory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Application installable (écran d'accueil) : plein écran + paysage -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3d7f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icone-maskable-192.png">
</head>
<body>
    <!-- Écran de connexion / inscription -->
    <div id="auth">
      <form id="authForm">
        <h1>BASTORY</h1>
        <input id="aPseudo" placeholder="Pseudo (pour créer un compte)" maxlength="16">
        <input id="aEmail" type="email" placeholder="Email" autocomplete="username">
        <input id="aMdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
        <button type="submit">Se connecter</button>
        <button type="button" id="bInscription" class="sec">Créer un compte</button>
        <button type="button" id="bGoogle" class="google">Continuer avec Google</button>
        <div id="authErr"></div>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="profil.js"></script>
    <!-- Moteur 3D (Three.js) pour les persos 3D, avec un 2e serveur en secours -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js&quot;><\/script>')"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="modele3d.js"></script>
    <script>
    // Charge la config en direct depuis Firebase, puis lance le jeu
    (async () => {
      try {
        const c = FIREBASE_CONFIG, stop = new AbortController(); setTimeout(() => stop.abort(), 4000);
        const r = await fetch(`https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents/bastory/config?key=${c.apiKey}`, { cache: 'no-store', signal: stop.signal });
        if (r.ok) window.CONFIG_DISTANTE = JSON.parse((await r.json()).fields.json.stringValue);
      } catch (e) { console.warn('Config en ligne indisponible → config.js', e); }
      try { // 📱 nom et icône de l'appli (réglables dans l'admin)
        const app = (window.CONFIG_DISTANTE || CONFIG_PAR_DEFAUT).app || {}, c = FIREBASE_CONFIG, base = location.href.replace(/[^/]*$/, '');
        if (app.nom) { document.title = app.nom; const h = document.querySelector('#auth h1'); if (h) h.textContent = app.nom; }
        let ic = app.icone || 'images/icone-maskable-512.png';
        if (ic.startsWith('fb:')) ic = (await (await fetch(`https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents/images/${ic.slice(3)}?key=${c.apiKey}`)).json()).fields.data.stringValue;
        const abs = ic.startsWith('data:') ? ic : base + ic;
        document.querySelector('link[rel=apple-touch-icon]').href = abs;
        document.querySelector('meta[name=theme-color]').content = app.couleur || '#2b1d6b';
        const t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title'; t.content = app.nomCourt || app.nom || 'Bastory'; document.head.appendChild(t);
        const man = { name: app.nom || 'Bastory', short_name: app.nomCourt || app.nom || 'Bastory', start_url: base + 'index.html', scope: base, display: 'fullscreen', orientation: 'landscape',
                      background_color: '#5a4dff', theme_color: app.couleur || '#2b1d6b', icons: app.icone ? [{ src: abs, sizes: '512x512', type: 'image/png', purpose: 'any' }]
                      : [192, 512].map(n => ({ src: base + `images/icone-maskable-${n}.png`, sizes: n + 'x' + n, type: 'image/png', purpose: 'any maskable' })) };
        document.querySelector('link[rel=manifest]').href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      } catch (e) { console.warn('Icône / nom de l\'appli', e); }
      const s = document.createElement('script'); s.src = 'jeu.js'; document.body.appendChild(s);
    })();
    </script>
</body>
</html>
