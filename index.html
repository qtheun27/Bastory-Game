<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bastory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="config.js"></script>          <!-- Config de secours (hors ligne) -->
    <script src="firebase-config.js"></script> <!-- Identifiants Firebase -->
    <script>
    // Charge la config en direct depuis Firebase, puis lance le jeu
    (async () => {
      try {
        const c = FIREBASE_CONFIG, stop = new AbortController(); setTimeout(() => stop.abort(), 4000);
        const r = await fetch(`https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents/bastory/config?key=${c.apiKey}`, { cache: 'no-store', signal: stop.signal });
        if (r.ok) window.CONFIG_DISTANTE = JSON.parse((await r.json()).fields.json.stringValue);
      } catch (e) { console.warn('Firebase indisponible → config.js utilisé', e); }
      const s = document.createElement('script'); s.src = 'jeu.js'; document.body.appendChild(s);
    })();
    </script>
</body>
</html>
