    m.grille.forEach((r, y) => [...r].forEach((c, x) => grid.append(el('div', { className: 'c', textContent: c === 'P' ? 'J' : c === 'E' ? 'B' : '', style: 'background:' + couleur(c), dataset: { x, y } }))));
    const peindre = cible => {
      if (!cible || !cible.dataset || cible.dataset.x === undefined) return;
      const x = +cible.dataset.x, y = +cible.dataset.y;
      const pose = (x, y, c) => { if (m.grille[y][x] === c) return; m.grille[y] = m.grille[y].slice(0, x) + c + m.grille[y].slice(x + 1);
        const d = grid.children[y * m.grille[0].length + x]; if (d) { d.style.background = couleur(c); d.textContent = c === 'P' ? 'J' : c === 'E' ? 'B' : /[1-8]/.test(c) ? c : ''; } };
      pose(x, y, pinceau);
      if (miroir) pose(m.grille[0].length - 1 - x, m.grille.length - 1 - y, ({ '1': '2', '2': '1', '5': '6', '6': '5' })[pinceau] || pinceau); // équipes inversées en face
      modifie();
    };
    grid.onpointerdown = e => { peint = true; peindre(e.target); };
    grid.onpointermove = e => { if (peint) peindre(document.elementFromPoint(e.clientX, e.clientY)); };
    onpointerup = () => peint = false;

    z.append(el('div', { className: 'grille-cartes' }, carte('⚙️ Réglages de la map', formulaire(m, CH.map))), pal, el('p', { className: 'aide', textContent: 'Choisis un outil puis clique ou glisse sur la grille. Coche 🪞 Miroir pour construire une moitié : l\'autre se fait toute seule.' }),
      el('div', { className: 'editeur' }, grid));
  }
};
function nouvelleMap(l, h) {
  const g = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : '.').join(''));
  g[Math.floor(h / 2)] = g[Math.floor(h / 2)].slice(0, 2) + 'P' + g[Math.floor(h / 2)].slice(3, l - 3) + 'E' + g[Math.floor(h / 2)].slice(l - 2);
  return { nom: 'Nouvelle map', theme: 'campagne', actif: true, casseMurs: true, casseBuissons: true, pvBloc: 3000, chanceObjet: 10, chanceCoffre: 100, grille: g };
}
function redim(m, l, h) {
  l = Math.max(8, Math.min(80, l)); h = Math.max(6, Math.min(60, h));
  m.grille = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (m.grille[y] || '')[x] || '.').join(''));
}
function bordure(m) { const l = m.grille[0].length, h = m.grille.length; m.grille = m.grille.map((r, y) => [...r].map((c, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : c).join('')); }

function afficher() {
  $('#onglets').innerHTML = '';
  for (const [k, t] of [['modes', '🎮 Modes'], ['persos', '🧍 Persos'], ['armes', '🗡 Armes'], ['boss', '👹 Boss'], ['pouvoirs', '✨ Pouvoirs'], ['maps', '🗺 Maps'], ['elements', '🌟 Éléments'], ['joueurs', '👤 Joueurs'], ['app', '📱 Appli']])
    $('#onglets').append(el('button', { textContent: t, className: k === onglet ? 'on' : '', onclick: () => { onglet = k; afficher(); } }));
  $('#zone').innerHTML = '';
  VUES[onglet]($('#zone'));
  const g = $('#zone .grille-cartes'), cartes = g ? [...g.children].filter(c => c.matches('details.carte')) : [];
  if (cartes.length > 2) { // 🔎 recherche + ouvrir / fermer tout
    const q = el('input', { type: 'search', placeholder: '🔎 Rechercher par nom…', className: 'recherche', oninput: () => cartes.forEach(c => c.style.display = c.querySelector('h3').textContent.toLowerCase().includes(q.value.toLowerCase()) ? '' : 'none') });
    g.before(el('div', { className: 'outils barre-liste' }, q, el('button', { className: 'sec', textContent: '📂 Tout ouvrir', onclick: () => cartes.forEach(c => c.open = true) }), el('button', { className: 'sec', textContent: '📁 Tout fermer', onclick: () => cartes.forEach(c => c.open = false) })));
  } else cartes.forEach(c => c.open = true);
  $('#zone').querySelectorAll('details.carte').forEach(c => { if (!cartes.includes(c) || cartes.length <= 2) c.open = true; }); // cartes seules : ouvertes
}

// ---------- Firebase ----------
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), FS = firebase.firestore(), DOC = FS.doc('bastory/config');
// 🖼️ Images : chacune dans son propre document Firestore (collection "images") → plus de limite de 1 Mo pour la config
const imagesFb = {};
async function afficherImage(elImg, src) {
  if (!src || !src.startsWith('fb:')) { elImg.src = src || ''; return; }
  if (imagesFb[src] === undefined) { try { const d = await FS.collection('images').doc(src.slice(3)).get(); imagesFb[src] = d.exists ? d.data().data : ''; } catch (e) { imagesFb[src] = ''; } }
  elImg.src = imagesFb[src];
}
async function sortirImages(o) { // remplace chaque image uploadée par un lien "fb:…" vers son document
  for (const [k, v] of Object.entries(o)) {
    if (v && typeof v === 'object') await sortirImages(v);
    else if (typeof v === 'string' && v.startsWith('data:image')) {
      const h = [...new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(v)))].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
      await FS.collection('images').doc(h).set({ data: v });
      imagesFb['fb:' + h] = v; o[k] = 'fb:' + h;
    }
  }
}
let user = null, miroir = true;
function majAuth() {
  if (user && !estAdmin(user)) { // 🔐 joueur non admin : accès refusé, retour au jeu
    auth.signOut(); $('#loginErr').textContent = '⛔ Accès réservé aux administrateurs';
    setTimeout(() => location.href = 'index.html', 1500); return;
  }
  $('#login').style.display = user ? 'none' : 'flex'; // écran de connexion obligatoire
  $('#auth').innerHTML = '';
  if (user) $('#auth').append(el('span', { textContent: '👤 ' + (user.displayName || 'Admin') }),
    el('button', { className: 'sec', textContent: 'Profil', onclick: () => ouvrirProfil(auth, majAuth) }),
    el('button', { className: 'sec', textContent: 'Déconnexion', onclick: () => auth.signOut() }));
}
$('#loginForm').onsubmit = e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  const msg = { 'auth/invalid-email': 'Email mal formé', 'auth/invalid-credential': 'Email ou mot de passe incorrect', 'auth/wrong-password': 'Mot de passe incorrect', 'auth/user-not-found': 'Compte inconnu', 'auth/too-many-requests': 'Trop d\'essais, réessaie plus tard' };
  auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value).catch(err => $('#loginErr').textContent = msg[err.code] || err.message);
};
auth.onAuthStateChanged(u => { user = u; majAuth(); });
async function chargerEnLigne() {
  try {
    const d = await DOC.get();
    if (d.exists) { cfg = migrerConfig(JSON.parse(d.data().json)); toast('Version en ligne chargée'); }
    else toast('Rien en ligne : connecte-toi et publie la 1re version');
  } catch (e) { toast('Firebase inaccessible → config.js'); }
  $('#modif').textContent = ''; afficher();
}

// ---------- Actions ----------
$('#bSave').onclick = async () => {
  try { await sortirImages(cfg); } catch (e) { return alert('Envoi des images refusé : ' + e.message + '\nVérifie les règles Firestore (collection images).'); }
  const json = JSON.stringify(cfg);
  if (json.length > 950000) return alert(`Config trop lourde (${Math.round(json.length / 1024)} Ko, max 1 Mo). Utilise des images plus légères.`);
  try {
    await DOC.set({ json, maj: firebase.firestore.FieldValue.serverTimestamp(), par: user.displayName || user.uid });
    $('#modif').textContent = ''; toast('🚀 Publié ! Le jeu est à jour pour tout le monde');
  } catch (e) { alert('Publication refusée : ' + e.message); }
};
$('#bJouer').onclick = () => open('index.html', '_blank');
$('#bExport').onclick = () => {
  const txt = '// ⚙️ DONNÉES DU JEU — sauvegarde console admin Bastory\nconst CONFIG_PAR_DEFAUT = ' + JSON.stringify(cfg, null, 2) + ';\n\n' + migrerConfig.toString() + '\n';
  el('a', { href: URL.createObjectURL(new Blob([txt], { type: 'text/javascript' })), download: 'config.js' }).click();
  toast('Sauvegarde téléchargée');
};
$('#bImport').onclick = () => $('#fichier').click();
$('#fichier').onchange = async e => {
  try { const t = await e.target.files[0].text(); cfg = migrerConfig(JSON.parse(t.slice(t.indexOf('{'), t.indexOf('};') + 1))); modifie(); afficher(); toast('Importé — pense à publier'); }
  catch (err) { alert('Fichier invalide'); }
};
$('#bReset').onclick = () => { if (confirm('Annuler les modifications non publiées ?')) chargerEnLigne(); };
onbeforeunload = e => { if ($('#modif').textContent) e.preventDefault(); };
afficher(); majAuth(); chargerEnLigne();
</script>
