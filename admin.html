const el = (tag, { dataset, ...props } = {}, ...enfants) => { const e = Object.assign(document.createElement(tag), props); if (dataset) Object.assign(e.dataset, dataset); e.append(...enfants); return e; };
const toast = t => { $('#toast').textContent = t; $('#toast').style.opacity = 1; setTimeout(() => $('#toast').style.opacity = 0, 2200); };
const modifie = () => $('#modif').textContent = '● modifications non enregistrées';

// ---------- Champs éditables (ajouter une ligne ici = nouveau champ dans la console) ----------

const optBoss = () => [['aleatoire', '🎲 Aléatoire'], ...Object.entries(cfg.bosses).map(([k, b]) => [k, b.nom])];
var CH_APP = [['nom','Nom de l\'appli','text'],['nomCourt','Nom court (écran d\'accueil)','text'],['icone','Icône de l\'appli (carrée)','icone'],['couleur','Couleur de fond de l\'icône','color']];

const CH = {

          ['t3CouleurTenue','3D : couleur des tenues (#hex)','text'],
          ['t3Motif','3D : motif du pelage','select',[['auto','Selon l\'espèce'],['uni','Uni'],['ventre','Ventre clair'],['rayures','Rayures'],['taches','Taches'],['panda','Panda']]],

function formulaire(obj, champs) {
  const f = el('div', { className: 'form' });
  for (const [k, lab, type, opts] of champs) {
    if (type === 'multi') { // cases à cocher multiples
      if (!Array.isArray(obj[k])) obj[k] = [];
      const box = el('div', { className: 'multi' });
      opts().forEach(([v, t]) => {
        const cb = el('input', { type: 'checkbox', checked: obj[k].includes(v) });
        cb.onchange = () => { obj[k] = cb.checked ? [...obj[k], v] : obj[k].filter(x => x !== v); modifie(); };
        box.append(el('label', { className: 'mc' }, cb, t));
      });
      f.append(el('div', { className: 'ligne' }, el('span', { textContent: lab }), box));
      continue;
    }
    let inp, prev = '';
    if (type === 'select') { inp = el('select'); (typeof opts === 'function' ? opts() : opts).forEach(([v, t]) => inp.add(new Option(t, v))); }
    else inp = el('input', { type: type === 'image' || type === 'icone' ? 'text' : type === 'check' ? 'checkbox' : type, step: 'any' });
    if (type === 'image' || type === 'icone') { prev = el('img', { className: 'apercu' }); afficherImage(prev, obj[k]); prev.onerror = () => prev.style.opacity = .2; prev.onload = () => prev.style.opacity = 1; }
    if (type === 'check') inp.checked = !!obj[k]; else inp.value = obj[k] ?? '';
    inp.oninput = inp.onchange = () => {
      obj[k] = type === 'number' ? (parseFloat(inp.value) || 0) : type === 'check' ? inp.checked : typeof obj[k] === 'number' ? +inp.value : inp.value;
      if (prev) afficherImage(prev, inp.value); modifie();
    };
    f.append(el('label', {}, el('span', { textContent: lab }), inp,
      type === 'icone' ? el('span', { className: 'img-outils' }, prev, boutonIcone(src => { inp.value = src; inp.oninput(); }, obj)) :
      type === 'image' ? el('span', { className: 'img-outils' }, prev, boutonUpload(src => { inp.value = src; inp.oninput(); }, () => inp.value)) : ''));
  }
  return f;
}
// 📷 Upload d'image (256 px) + 🪄 gomme magique qui retire le fond uni
function boutonIcone(cb, obj) { // icône d'appli : carré 512 px, image centrée sur fond uni (compatible iPhone/Android)
  const f = el('input', { type: 'file', accept: 'image/*', hidden: true });
  f.onchange = async () => {
    const fi = f.files[0]; if (!fi) return; const im = new Image(); im.src = URL.createObjectURL(fi); await im.decode();
    const c = el('canvas', { width: 512, height: 512 }), x = c.getContext('2d'), k = Math.min(440 / im.width, 440 / im.height);
    x.fillStyle = obj.couleur || '#2b1d6b'; x.fillRect(0, 0, 512, 512); x.drawImage(im, 256 - im.width * k / 2, 256 - im.height * k / 2, im.width * k, im.height * k);
    cb(c.toDataURL('image/png')); toast('Icône importée'); f.value = '';
  };
  return el('span', {}, f, el('button', { type: 'button', className: 'sec', textContent: '📷', title: 'Choisir l\'icône', onclick: e => { e.preventDefault(); f.click(); } }));
}
function boutonUpload(cb, src) {
  const f = el('input', { type: 'file', accept: 'image/*', hidden: true });
  f.onchange = async () => { if (f.files[0]) { const r = await reduireImage(f.files[0]); cb(r.data); toast(r.gomme ? '🪄 Image importée, fond retiré' : 'Image importée'); } f.value = ''; };
  const b = (t, title, fn) => el('button', { type: 'button', className: 'sec', textContent: t, title, onclick: e => { e.preventDefault(); fn(); } });
  return el('span', {}, f, b('📷', 'Uploader une image (fond retiré automatiquement)', () => f.click()),
    b('🪄', 'Gomme magique : retirer le fond', async () => {
      try { const c = await chargerCanvas(src()); gommer(c); cb(versDataURL(c)); toast('🪄 Fond retiré — « Annuler » pour revenir en arrière'); }
      catch (e) { alert('Image illisible'); }
    }));
}
function chargerCanvas(src, max = 256) {
  return new Promise((ok, ko) => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = el('canvas', { width: Math.round(i.width * k), height: Math.round(i.height * k) });
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); ok(c);
    };
    i.onerror = ko; i.src = src;
  });
}
const versDataURL = c => { const d = c.toDataURL('image/webp', 0.9); return d.startsWith('data:image/webp') ? d : c.toDataURL('image/png'); };
function fondUni(c) { // les 4 coins sont opaques et de la même couleur = image avec fond
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const px = [0, w - 1, (h - 1) * w, w * h - 1].map(p => d.slice(p * 4, p * 4 + 4));
  return px.every(p => p[3] > 200 && Math.abs(p[0] - px[0][0]) + Math.abs(p[1] - px[0][1]) + Math.abs(p[2] - px[0][2]) < 60);
}
function gommer(c, tol = 90) { // efface les pixels proches de la couleur des bords (remplissage depuis les bords)
  const x = c.getContext('2d'), w = c.width, h = c.height, im = x.getImageData(0, 0, w, h), d = im.data;
  const vu = new Uint8Array(w * h), pile = [];
  for (let i = 0; i < w; i++) pile.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) pile.push(j * w, j * w + w - 1);
  const refs = [0, w - 1, (h - 1) * w, h * w - 1].map(p => [d[p * 4], d[p * 4 + 1], d[p * 4 + 2]]);
  const proche = p => refs.some(r => Math.abs(d[p * 4] - r[0]) + Math.abs(d[p * 4 + 1] - r[1]) + Math.abs(d[p * 4 + 2] - r[2]) < tol);
  while (pile.length) {
    const p = pile.pop(); if (vu[p]) continue; vu[p] = 1;
    if (d[p * 4 + 3] < 10 || proche(p)) {
      d[p * 4 + 3] = 0; const px = p % w, py = (p / w) | 0;
      if (px > 0) pile.push(p - 1); if (px < w - 1) pile.push(p + 1); if (py > 0) pile.push(p - w); if (py < h - 1) pile.push(p + w);
    }
  }
  const vide = p => d[p * 4 + 3] === 0; // bords adoucis
  for (let p = 0; p < w * h; p++) if (d[p * 4 + 3] > 0 && ((p % w > 0 && vide(p - 1)) || (p % w < w - 1 && vide(p + 1)) || (p >= w && vide(p - w)) || (p < w * (h - 1) && vide(p + w)))) d[p * 4 + 3] = Math.min(d[p * 4 + 3], 140);
  x.putImageData(im, 0, 0);
}
async function reduireImage(file) {
  const u = URL.createObjectURL(file), c = await chargerCanvas(u); URL.revokeObjectURL(u);
  const gomme = fondUni(c); if (gomme) gommer(c);
  return { data: versDataURL(c), gomme };
}

async function resoudreImg(src) { if (!src || !src.startsWith('fb:')) return src; const im = new Image(); await afficherImage(im, src); return im.src; }
function apercu3D(p, form) {
  if (typeof Perso3D === 'undefined' || !Perso3D.dispo()) return form;

  form.addEventListener('input', () => { clearTimeout(minuterie); minuterie = setTimeout(maj, 450); });

}

function nouvelleMap(l, h) {
  const g = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : '.').join(''));
  g[Math.floor(h / 2)] = g[Math.floor(h / 2)].slice(0, 2) + 'P' + g[Math.floor(h / 2)].slice(3, l - 3) + 'E' + g[Math.floor(h / 2)].slice(l - 2);
  return { nom: 'Nouvelle map', herbe1: '#5cc24a', herbe2: '#52b442', mur: '#c98a4b', murFace: '#8e5a2b', buisson: '#2fae4a', buissonFonce: '#1f7a35', eau: '#3aa6e0', grille: g };
}
function redim(m, l, h) {
  l = Math.max(8, Math.min(80, l)); h = Math.max(6, Math.min(60, h));
  m.grille = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (m.grille[y] || '')[x] || '.').join(''));
}
function bordure(m) { const l = m.grille[0].length, h = m.grille.length; m.grille = m.grille.map((r, y) => [...r].map((c, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : c).join('')); }

// ---------- Firebase ----------
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), FS = firebase.firestore(), DOC = FS.doc('bastory/config');
// 🖼️ Images : chacune dans son propre document Firestore (collection "images") → plus de limite de 1 Mo pour la config
const imagesFb = {};
async function afficherImage(elImg, src) {
  if (!src || !src.startsWith('fb:')) { elImg.src = src || ''; return; }
  if (imagesFb[src] === undefined) { try { const d = await FS.collection('images').doc(src.slice(3)).get(); imagesFb[src] = d.exists ? d.data().data : ''; } catch (e) { imagesFb[src] = ''; } }
  elImg.src = imagesFb[src];
}
async function sortirImages(o) { // remplace chaque image uploadée par un lien "fb:…" vers son document
  for (const [k, v] of Object.entries(o)) {
    if (v && typeof v === 'object') await sortirImages(v);
    else if (typeof v === 'string' && v.startsWith('data:image')) {
      const h = [...new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(v)))].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
      await FS.collection('images').doc(h).set({ data: v });
      imagesFb['fb:' + h] = v; o[k] = 'fb:' + h;
    }
  }
}
let user = null;

  $('#login').style.display = user ? 'none' : 'flex'; // écran de connexion obligatoire
  $('#auth').innerHTML = '';
  if (user) $('#auth').append(el('span', { textContent: '👤 ' + (user.displayName || 'Admin') }),
    el('button', { className: 'sec', textContent: 'Profil', onclick: () => ouvrirProfil(auth, majAuth) }),
    el('button', { className: 'sec', textContent: 'Déconnexion', onclick: () => auth.signOut() }));
}
$('#loginForm').onsubmit = e => {

  const msg = { 'auth/invalid-email': 'Email mal formé', 'auth/invalid-credential': 'Email ou mot de passe incorrect', 'auth/wrong-password': 'Mot de passe incorrect', 'auth/user-not-found': 'Compte inconnu', 'auth/too-many-requests': 'Trop d\'essais, réessaie plus tard' };

};

async function chargerEnLigne() {
  try {
    const d = await DOC.get();
    if (d.exists) { cfg = migrerConfig(JSON.parse(d.data().json)); toast('Version en ligne chargée'); }
    else toast('Rien en ligne : connecte-toi et publie la 1re version');
  } catch (e) { toast('Firebase inaccessible → config.js'); }
  $('#modif').textContent = ''; afficher();
}

$('#bSave').onclick = async () => {
  try { await sortirImages(cfg); } catch (e) { return alert('Envoi des images refusé : ' + e.message + '\nVérifie les règles Firestore (collection images).'); }
  const json = JSON.stringify(cfg);
  if (json.length > 950000) return alert(`Config trop lourde (${Math.round(json.length / 1024)} Ko, max 1 Mo). Utilise des images plus légères.`);
  try {
    await DOC.set({ json, maj: firebase.firestore.FieldValue.serverTimestamp(), par: user.displayName || user.uid });
    $('#modif').textContent = ''; toast('🚀 Publié ! Le jeu est à jour pour tout le monde');
  } catch (e) { alert('Publication refusée : ' + e.message); }
};
