<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastory — Console Admin</title>
<style>
  :root { --bg:#1b1535; --carte:#2a2250; --txt:#f3f0ff; --acc:#ffd23f; --bord:#443a7a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:5; background:#120e26; padding:10px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:2px solid var(--bord); }
  header h1 { font-size:18px; margin:0 12px 0 0; color:var(--acc); }
  button { background:var(--acc); color:#1a1030; border:0; border-radius:8px; padding:8px 12px; font-weight:700; cursor:pointer; }
  button.sec { background:#443a7a; color:var(--txt); }
  button.danger { background:#e74c3c; color:#fff; }
  nav { display:flex; gap:6px; padding:10px 14px; flex-wrap:wrap; }
  nav button { background:#443a7a; color:var(--txt); }
  nav button.on { background:var(--acc); color:#1a1030; }
  main { padding:0 14px 40px; }
  .grille-cartes { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:12px; }
  .carte h3 { margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .form label { display:grid; grid-template-columns:130px 1fr auto; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
  input, select { width:100%; padding:6px; border-radius:6px; border:1px solid var(--bord); background:#15112b; color:var(--txt); }
  .form .ligne { display:grid; grid-template-columns:130px 1fr; gap:8px; margin:6px 0; font-size:13px; }
  .multi { display:flex; flex-wrap:wrap; gap:4px 12px; }
  .form label.mc { display:flex; gap:6px; margin:0; }
  input[type=checkbox] { width:22px; height:22px; }
  input[type=color] { padding:2px; height:32px; }
  #login { position:fixed; inset:0; z-index:20; background:#0d0a1f; display:flex; align-items:center; justify-content:center; }
  #login form { background:var(--carte); border:2px solid var(--bord); border-radius:16px; padding:28px; width:min(340px,90vw); display:flex; flex-direction:column; gap:12px; }
  #login h2 { margin:0 0 6px; color:var(--acc); text-align:center; }
  #login input { padding:12px; font-size:16px; }
  #login button { padding:12px; font-size:16px; }
  #loginErr { color:#ff6b6b; font-size:13px; min-height:16px; }
  #auth { display:flex; gap:6px; align-items:center; font-size:13px; }
  .img-outils { display:flex; gap:4px; align-items:center; }
  .apercu { width:40px; height:40px; object-fit:contain; background:#fff2; border-radius:6px; }
  .outils { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .palette button { background:#15112b; color:var(--txt); border:2px solid transparent; }
  .palette button.on { border-color:var(--acc); }
  .editeur { overflow:auto; max-width:100%; border:2px solid var(--bord); border-radius:8px; background:#000; touch-action:none; }
  .grid { display:grid; gap:1px; width:max-content; user-select:none; }
  .c { width:22px; height:22px; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; color:#fff; }
  .aide { font-size:13px; opacity:.75; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:.3s; pointer-events:none; }
  #modif { color:#ff9f1a; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>⚙️ Bastory Admin</h1>
  <span id="auth"></span>
  <button id="bSave">🚀 Publier en ligne</button>
  <button id="bJouer" class="sec">▶ Tester le jeu</button>
  <button id="bExport" class="sec">⬇ Sauvegarde</button>
  <button id="bImport" class="sec">⬆ Importer</button>
  <button id="bReset" class="danger">↺ Annuler</button>
  <span id="modif"></span>
  <input type="file" id="fichier" accept=".js,.json" hidden>
</header>
<div id="login"><form id="loginForm">
  <h2>⚙️ Bastory Admin</h2>
  <input id="lEmail" type="email" placeholder="Email" autocomplete="username" required>
  <input id="lPass" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <button type="submit">🔑 Se connecter</button>
  <div id="loginErr"></div>
</form></div>
<nav id="onglets"></nav>
<main id="zone"></main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script src="profil.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const clone = o => JSON.parse(JSON.stringify(o));
let cfg = migrerConfig(clone(CONFIG_PAR_DEFAUT));
let onglet = 'modes', mapSel = 0, pinceau = '#', peint = false;
const $ = s => document.querySelector(s);
const el = (tag, { dataset, ...props } = {}, ...enfants) => { const e = Object.assign(document.createElement(tag), props); if (dataset) Object.assign(e.dataset, dataset); e.append(...enfants); return e; };
const toast = t => { $('#toast').textContent = t; $('#toast').style.opacity = 1; setTimeout(() => $('#toast').style.opacity = 0, 2200); };
const modifie = () => $('#modif').textContent = '● modifications non enregistrées';

// ---------- Champs éditables (ajouter une ligne ici = nouveau champ dans la console) ----------
const optArmes = () => Object.entries(cfg.armes).map(([k, a]) => [k, a.nom]);
const optBoss = () => [['aleatoire', '🎲 Aléatoire'], ...Object.entries(cfg.bosses).map(([k, b]) => [k, b.nom])];
const optMaps = () => [[-1, 'Au choix du joueur'], ...cfg.maps.map((m, i) => [i, m.nom])];
const CH = {
  mode:  [['nom','Nom','text'],['description','Description','text'],['actif','Visible dans le jeu','check'],
          ['type','Type de jeu','select',[['solo','🧍 Solo'],['multi','👥 Multijoueur en ligne']]],
          ['joueursMin','Joueurs minimum (multi)','number'],['joueursMax','Joueurs maximum (multi)','number'],
          ['equipes','Équipes (multi)','select',[['chacun','Chacun pour soi'],['deux','2 équipes'],['coop','Tous ensemble (coop)']]],
          ['pointsVictoire','Points par victoire','number'],['pointsDefaite','Points par défaite','number'],
          ['boss','Boss activés','check'],['nbBoss','Nombre de boss (max 10)','number'],
          ['typesBoss','Types de boss (aucun coché = au hasard)','multi',() => Object.entries(cfg.bosses).map(([k, b]) => [k, b.nom])],['map','Map','select',optMaps]],
  perso: [['nom','Nom','text'],['image','Image jeu (vue du dessus)','image'],['imageCarte','Image carte (menu, fin)','image'],['couleur','Couleur','color'],['pvMax','Points de vie','number'],
          ['vitesse','Vitesse (2-8)','number'],['arme','Arme','select',optArmes],['degats','Dégâts','number'],['portee','Portée (px)','number'],['delaiTir','Cadence : délai entre 2 tirs (60 = 1 s)','number'],
          ['munitions','Nombre de munitions','number'],['recharge','Recharge d\'1 munition (60 = 1 s)','number']],
  arme:  [['nom','Nom','text'],['image','Image (vide = boule)','image'],
          ['type','Trajectoire','select',[['lob','Lancer en cloche (passe les murs)'],['retour','Aller-retour'],['droit','Tir droit'],['terrain','🌋 Terrain (fait sortir des cases du sol)']]],
          ['effet','Animation d\'impact','select',[['explosion','💥 Explosion'],['entaille','⚔️ Entaille'],['etincelle','✨ Étincelles'],['impact','🔨 Onde de choc'],
            ['foudre','⚡ Foudre'],['glace','❄️ Glace'],['poison','☠️ Poison'],['feu','🔥 Feu'],['etoiles','⭐ Étoiles'],['vortex','🌀 Tourbillon'],['eclaboussure','💦 Éclaboussure']]],
          ['vitesse','Vitesse','number'],['taille','Taille','number'],['rayon','Rayon explosion','number'],['couleur','Couleur effet','color'],
          ['forme','🌋 Forme (terrain)','select',[['zone','Zone ronde'],['ligne','Ligne devant soi'],['mur','Mur en travers'],['croix','Croix']]],
          ['nbCases','🌋 Nombre / taille (cases)','number'],
          ['typeCase','🌋 Case créée','select',[['#','🟫 Mur (bloquant)'],['B','🌳 Buisson (cache)'],['W','🟦 Eau (bloque la marche)'],['.','🟩 Herbe (efface les obstacles)']]],
          ['dureeCase','🌋 Durée (s, 0 = permanent)','number'],['delaiCase','🌋 Délai entre cases (60 = 1 s)','number']],
  boss:  [['nom','Nom','text'],['image','Image jeu (vue du dessus)','image'],['imageCarte','Image carte (fin de partie)','image'],['pvMax','Points de vie','number'],['vitesse','Vitesse','number'],['degats','Dégâts du coup','number'],
          ['delaiAttaque','Recharge (60 = 1 s)','number'],['rayonAttaque','Rayon du coup','number'],['taille','Taille (rayon)','number']],
  map:   [['nom','Nom','text'],['herbe1','Herbe 1','color'],['herbe2','Herbe 2','color'],['mur','Mur (dessus)','color'],['murFace','Mur (face)','color'],
          ['buisson','Buisson','color'],['buissonFonce','Buisson foncé','color'],['eau','Eau','color'],
          ['casseMurs','Murs cassables','check'],['casseBuissons','Buissons cassables','check'],['pvBloc','Solidité d\'un mur (dégâts)','number'],
          ['chanceObjet','% objet rare (mur/buisson)','number'],['chanceCoffre','% objet rare (coffre 🎁)','number']],
  pouvoir: [['nom','Nom','text'],['icone','Icône (emoji)','text'],['couleur','Couleur','color'],
          ['effet','Effet','select',[['vitesse','🏃 Vitesse × valeur'],['degats','💪 Dégâts × valeur'],['bouclier','🛡️ Dégâts reçus × valeur'],
            ['soin','❤️ Soin instantané (0.4 = 40 % PV)'],['munitions','♾️ Munitions illimitées'],['invisible','👻 Invisible (comme dans un buisson)']]],
          ['valeur','Valeur','number'],['duree','Durée (secondes)','number'],['rarete','Fréquence (+ grand = + fréquent)','number']]
};
function formulaire(obj, champs) {
  const f = el('div', { className: 'form' });
  for (const [k, lab, type, opts] of champs) {
    if (type === 'multi') { // cases à cocher multiples
      if (!Array.isArray(obj[k])) obj[k] = [];
      const box = el('div', { className: 'multi' });
      opts().forEach(([v, t]) => {
        const cb = el('input', { type: 'checkbox', checked: obj[k].includes(v) });
        cb.onchange = () => { obj[k] = cb.checked ? [...obj[k], v] : obj[k].filter(x => x !== v); modifie(); };
        box.append(el('label', { className: 'mc' }, cb, t));
      });
      f.append(el('div', { className: 'ligne' }, el('span', { textContent: lab }), box));
      continue;
    }
    let inp, prev = '';
    if (type === 'select') { inp = el('select'); (typeof opts === 'function' ? opts() : opts).forEach(([v, t]) => inp.add(new Option(t, v))); }
    else inp = el('input', { type: type === 'image' ? 'text' : type === 'check' ? 'checkbox' : type, step: 'any' });
    if (type === 'image') { prev = el('img', { className: 'apercu', src: obj[k] || '' }); prev.onerror = () => prev.style.opacity = .2; prev.onload = () => prev.style.opacity = 1; }
    if (type === 'check') inp.checked = !!obj[k]; else inp.value = obj[k] ?? '';
    inp.oninput = inp.onchange = () => {
      obj[k] = type === 'number' ? (parseFloat(inp.value) || 0) : type === 'check' ? inp.checked : typeof obj[k] === 'number' ? +inp.value : inp.value;
      if (prev) prev.src = inp.value; modifie();
    };
    f.append(el('label', {}, el('span', { textContent: lab }), inp,
      type === 'image' ? el('span', { className: 'img-outils' }, prev, boutonUpload(src => { inp.value = src; inp.oninput(); }, () => inp.value)) : ''));
  }
  return f;
}
// 📷 Upload d'image (256 px) + 🪄 gomme magique qui retire le fond uni
function boutonUpload(cb, src) {
  const f = el('input', { type: 'file', accept: 'image/*', hidden: true });
  f.onchange = async () => { if (f.files[0]) { const r = await reduireImage(f.files[0]); cb(r.data); toast(r.gomme ? '🪄 Image importée, fond retiré' : 'Image importée'); } f.value = ''; };
  const b = (t, title, fn) => el('button', { type: 'button', className: 'sec', textContent: t, title, onclick: e => { e.preventDefault(); fn(); } });
  return el('span', {}, f, b('📷', 'Uploader une image (fond retiré automatiquement)', () => f.click()),
    b('🪄', 'Gomme magique : retirer le fond', async () => {
      try { const c = await chargerCanvas(src()); gommer(c); cb(versDataURL(c)); toast('🪄 Fond retiré — « Annuler » pour revenir en arrière'); }
      catch (e) { alert('Image illisible'); }
    }));
}
function chargerCanvas(src, max = 256) {
  return new Promise((ok, ko) => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = el('canvas', { width: Math.round(i.width * k), height: Math.round(i.height * k) });
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); ok(c);
    };
    i.onerror = ko; i.src = src;
  });
}
const versDataURL = c => { const d = c.toDataURL('image/webp', 0.9); return d.startsWith('data:image/webp') ? d : c.toDataURL('image/png'); };
function fondUni(c) { // les 4 coins sont opaques et de la même couleur = image avec fond
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const px = [0, w - 1, (h - 1) * w, w * h - 1].map(p => d.slice(p * 4, p * 4 + 4));
  return px.every(p => p[3] > 200 && Math.abs(p[0] - px[0][0]) + Math.abs(p[1] - px[0][1]) + Math.abs(p[2] - px[0][2]) < 60);
}
function gommer(c, tol = 90) { // efface les pixels proches de la couleur des bords (remplissage depuis les bords)
  const x = c.getContext('2d'), w = c.width, h = c.height, im = x.getImageData(0, 0, w, h), d = im.data;
  const vu = new Uint8Array(w * h), pile = [];
  for (let i = 0; i < w; i++) pile.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) pile.push(j * w, j * w + w - 1);
  const refs = [0, w - 1, (h - 1) * w, h * w - 1].map(p => [d[p * 4], d[p * 4 + 1], d[p * 4 + 2]]);
  const proche = p => refs.some(r => Math.abs(d[p * 4] - r[0]) + Math.abs(d[p * 4 + 1] - r[1]) + Math.abs(d[p * 4 + 2] - r[2]) < tol);
  while (pile.length) {
    const p = pile.pop(); if (vu[p]) continue; vu[p] = 1;
    if (d[p * 4 + 3] < 10 || proche(p)) {
      d[p * 4 + 3] = 0; const px = p % w, py = (p / w) | 0;
      if (px > 0) pile.push(p - 1); if (px < w - 1) pile.push(p + 1); if (py > 0) pile.push(p - w); if (py < h - 1) pile.push(p + w);
    }
  }
  const vide = p => d[p * 4 + 3] === 0; // bords adoucis
  for (let p = 0; p < w * h; p++) if (d[p * 4 + 3] > 0 && ((p % w > 0 && vide(p - 1)) || (p % w < w - 1 && vide(p + 1)) || (p >= w && vide(p - w)) || (p < w * (h - 1) && vide(p + w)))) d[p * 4 + 3] = Math.min(d[p * 4 + 3], 140);
  x.putImageData(im, 0, 0);
}
async function reduireImage(file) {
  const u = URL.createObjectURL(file), c = await chargerCanvas(u); URL.revokeObjectURL(u);
  const gomme = fondUni(c); if (gomme) gommer(c);
  return { data: versDataURL(c), gomme };
}
function carte(titre, contenu, onSuppr) {
  const h = el('h3', { textContent: titre });
  if (onSuppr) h.append(el('button', { className: 'danger', textContent: '🗑', onclick: onSuppr }));
  return el('div', { className: 'carte' }, h, contenu);
}

// ---------- Vues ----------
const VUES = {
  persos(z) {
    const g = el('div', { className: 'grille-cartes' });
    cfg.persos.forEach((p, i) => g.append(carte(p.nom, formulaire(p, CH.perso), () => {
      if (cfg.persos.length > 1 && confirm('Supprimer ' + p.nom + ' ?')) { cfg.persos.splice(i, 1); modifie(); afficher(); }
    })));
    z.append(el('div', { className: 'outils' }, el('button', { textContent: '➕ Nouveau perso', onclick: () => {
      cfg.persos.push({ nom: 'NOUVEAU', image: '', imageCarte: '', munitions: 3, recharge: 60, couleur: '#e67e22', pvMax: 5000, vitesse: 5, arme: Object.keys(cfg.armes)[0], degats: 1000, portee: 350, delaiTir: 30 });
      modifie(); afficher();
    } })), g);
  },
  armes(z) {
    const g = el('div', { className: 'grille-cartes' });
    for (const [k, a] of Object.entries(cfg.armes)) g.append(carte(a.nom + ' (' + k + ')', formulaire(a, CH.arme), () => {
      if (cfg.persos.some(p => p.arme === k)) return alert('Arme utilisée par un perso : change d\'abord son arme.');
      if (confirm('Supprimer ' + a.nom + ' ?')) { delete cfg.armes[k]; modifie(); afficher(); }
    }));
    z.append(el('div', { className: 'outils' }, el('button', { textContent: '➕ Nouvelle arme', onclick: () => {
      const id = (prompt('Identifiant de l\'arme (ex : laser)') || '').trim().toLowerCase().replace(/\W/g, '');
      if (!id || cfg.armes[id]) return;
      cfg.armes[id] = { nom: id, image: '', type: 'droit', effet: 'etincelle', vitesse: 12, taille: 12, rayon: 0, couleur: '#ffffff', forme: 'zone', nbCases: 3, typeCase: '#', dureeCase: 5, delaiCase: 4 };
      modifie(); afficher();
    } })), g);
  },
  modes(z) {
    const g = el('div', { className: 'grille-cartes' });
    cfg.modes.forEach((m, i) => g.append(carte((m.type === 'multi' ? '👥 ' : '🧍 ') + m.nom, formulaire(m, CH.mode), () => {
      if (cfg.modes.length > 1 && confirm('Supprimer le mode ' + m.nom + ' ?')) { cfg.modes.splice(i, 1); modifie(); afficher(); }
    })));
    z.append(el('div', { className: 'outils' }, el('button', { textContent: '➕ Nouveau mode', onclick: () => {
      cfg.modes.push({ nom: 'Nouveau mode', description: '', type: 'solo', actif: true, joueursMin: 1, joueursMax: 1, equipes: 'chacun', boss: true, nbBoss: 1, typesBoss: [], map: -1, pointsVictoire: 30, pointsDefaite: 5 });
      modifie(); afficher();
    } })), el('p', { className: 'aide', textContent: 'Solo/coop : on gagne quand tous les boss sont vaincus. Chacun pour soi / 2 équipes : on gagne quand tous les adversaires tombent (les boss attaquent tout le monde). Multi : départ dès que le max est atteint, ou 10 s après le minimum.' }), g);
  },
  pouvoirs(z) {
    const g = el('div', { className: 'grille-cartes' });
    for (const [k, p] of Object.entries(cfg.pouvoirs)) g.append(carte((p.icone || '✨') + ' ' + p.nom, formulaire(p, CH.pouvoir), () => {
      if (confirm('Supprimer ' + p.nom + ' ?')) { delete cfg.pouvoirs[k]; modifie(); afficher(); }
    }));
    z.append(el('div', { className: 'outils' }, el('button', { textContent: '➕ Nouveau pouvoir', onclick: () => {
      const id = (prompt('Identifiant du pouvoir (ex : geant)') || '').trim().toLowerCase().replace(/\W/g, '');
      if (!id || cfg.pouvoirs[id]) return;
      cfg.pouvoirs[id] = { nom: id, icone: '✨', couleur: '#ffffff', effet: 'vitesse', valeur: 1.5, duree: 8, rarete: 1 };
      modifie(); afficher();
    } })), el('p', { className: 'aide', textContent: 'Les pouvoirs apparaissent quand on casse un élément (réglages dans chaque map) ou un coffre 🎁. On les ramasse en marchant dessus.' }), g);
  },
  boss(z) {
    const g = el('div', { className: 'grille-cartes' });
    for (const [k, b] of Object.entries(cfg.bosses)) g.append(carte('👹 ' + b.nom + ' (' + k + ')', formulaire(b, CH.boss), () => {
      if (Object.keys(cfg.bosses).length < 2) return alert('Il faut garder au moins un boss.');
      if (cfg.modes.some(m => (m.typesBoss || []).includes(k))) return alert('Boss utilisé par un mode : change d\'abord le mode.');
      if (confirm('Supprimer ' + b.nom + ' ?')) { delete cfg.bosses[k]; modifie(); afficher(); }
    }));
    z.append(el('div', { className: 'outils' }, el('button', { textContent: '➕ Nouveau boss', onclick: () => {
      const id = (prompt('Identifiant du boss (ex : dragon)') || '').trim().toLowerCase().replace(/\W/g, '');
      if (!id || cfg.bosses[id]) return;
      cfg.bosses[id] = { ...clone(Object.values(cfg.bosses)[0]), nom: id.toUpperCase() };
      modifie(); afficher();
    } })), g);
  },
  maps(z) {
    mapSel = Math.min(mapSel, cfg.maps.length - 1);
    const m = cfg.maps[mapSel];
    const sel = el('select', { onchange: () => { mapSel = +sel.value; afficher(); } });
    cfg.maps.forEach((mp, i) => sel.add(new Option(mp.nom, i, false, i === mapSel)));
    const larg = el('input', { type: 'number', value: m.grille[0].length, style: 'width:70px' });
    const haut = el('input', { type: 'number', value: m.grille.length, style: 'width:70px' });
    z.append(el('div', { className: 'outils' }, sel,
      el('button', { textContent: '➕ Nouvelle', onclick: () => { cfg.maps.push(nouvelleMap(24, 16)); mapSel = cfg.maps.length - 1; modifie(); afficher(); } }),
      el('button', { className: 'sec', textContent: '⧉ Dupliquer', onclick: () => { const c = clone(m); c.nom += ' (copie)'; cfg.maps.push(c); mapSel = cfg.maps.length - 1; modifie(); afficher(); } }),
      el('button', { className: 'danger', textContent: '🗑 Supprimer', onclick: () => { if (cfg.maps.length > 1 && confirm('Supprimer ' + m.nom + ' ?')) { cfg.maps.splice(mapSel, 1); mapSel = 0; modifie(); afficher(); } } }),
      el('span', { textContent: 'Taille :' }), larg, el('span', { textContent: '×' }), haut,
      el('button', { className: 'sec', textContent: 'Redimensionner', onclick: () => { redim(m, +larg.value, +haut.value); modifie(); afficher(); } }),
      el('button', { className: 'sec', textContent: '▭ Bordure de murs', onclick: () => { bordure(m); modifie(); afficher(); } })));

    const PAL = [['.', '🟩 Herbe'], ['#', '🟫 Mur'], ['B', '🌳 Buisson'], ['W', '🟦 Eau'], ['P', '🧍 Départ joueur'], ['E', '👹 Départ boss'], ['C', '🎁 Coffre (objet rare)']];
    const pal = el('div', { className: 'outils palette' });
    PAL.forEach(([c, t]) => pal.append(el('button', { textContent: t, className: c === pinceau ? 'on' : '', onclick: () => { pinceau = c; afficher(); } })));

    const grid = el('div', { className: 'grid', style: `grid-template-columns:repeat(${m.grille[0].length},22px)` });
    const couleur = c => ({ '#': m.mur, 'B': m.buissonFonce, 'W': m.eau, 'P': '#3498db', 'E': '#e74c3c', 'C': '#f1c40f' }[c] || m.herbe1);
    m.grille.forEach((r, y) => [...r].forEach((c, x) => grid.append(el('div', { className: 'c', textContent: c === 'P' ? 'J' : c === 'E' ? 'B' : '', style: 'background:' + couleur(c), dataset: { x, y } }))));
    const peindre = cible => {
      if (!cible || !cible.dataset || cible.dataset.x === undefined) return;
      const x = +cible.dataset.x, y = +cible.dataset.y;
      if (m.grille[y][x] === pinceau) return;
      m.grille[y] = m.grille[y].slice(0, x) + pinceau + m.grille[y].slice(x + 1);
      modifie();
      cible.style.background = couleur(pinceau); cible.textContent = pinceau === 'P' ? 'J' : pinceau === 'E' ? 'B' : '';
    };
    grid.onpointerdown = e => { peint = true; peindre(e.target); };
    grid.onpointermove = e => { if (peint) peindre(document.elementFromPoint(e.clientX, e.clientY)); };
    onpointerup = () => peint = false;

    z.append(pal, el('p', { className: 'aide', textContent: 'Choisis un élément puis clique/glisse sur la grille. Départ joueur : le 1er sert en solo, le 2e au 2e joueur en 1V1. Départs boss : autant que tu veux (sinon placés au hasard).' }),
      el('div', { className: 'editeur' }, grid), el('br'), el('div', { className: 'grille-cartes' }, carte('🎨 Couleurs de la map', formulaire(m, CH.map))));
  }
};
function nouvelleMap(l, h) {
  const g = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : '.').join(''));
  g[Math.floor(h / 2)] = g[Math.floor(h / 2)].slice(0, 2) + 'P' + g[Math.floor(h / 2)].slice(3, l - 3) + 'E' + g[Math.floor(h / 2)].slice(l - 2);
  return { nom: 'Nouvelle map', herbe1: '#5cc24a', herbe2: '#52b442', mur: '#c98a4b', murFace: '#8e5a2b', buisson: '#2fae4a', buissonFonce: '#1f7a35', eau: '#3aa6e0', grille: g };
}
function redim(m, l, h) {
  l = Math.max(8, Math.min(80, l)); h = Math.max(6, Math.min(60, h));
  m.grille = Array.from({ length: h }, (_, y) => Array.from({ length: l }, (_, x) => (m.grille[y] || '')[x] || '.').join(''));
}
function bordure(m) { const l = m.grille[0].length, h = m.grille.length; m.grille = m.grille.map((r, y) => [...r].map((c, x) => (x === 0 || y === 0 || x === l - 1 || y === h - 1) ? '#' : c).join('')); }

function afficher() {
  $('#onglets').innerHTML = '';
  for (const [k, t] of [['modes', '🎮 Modes'], ['persos', '🧍 Persos'], ['armes', '🗡 Armes'], ['boss', '👹 Boss'], ['pouvoirs', '✨ Pouvoirs'], ['maps', '🗺 Maps']])
    $('#onglets').append(el('button', { textContent: t, className: k === onglet ? 'on' : '', onclick: () => { onglet = k; afficher(); } }));
  $('#zone').innerHTML = '';
  VUES[onglet]($('#zone'));
}

// ---------- Firebase ----------
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), DOC = firebase.firestore().doc('bastory/config');
let user = null;
function majAuth() {
  $('#login').style.display = user ? 'none' : 'flex'; // écran de connexion obligatoire
  $('#auth').innerHTML = '';
  if (user) $('#auth').append(el('span', { textContent: '👤 ' + (user.displayName || 'Admin') }),
    el('button', { className: 'sec', textContent: 'Profil', onclick: () => ouvrirProfil(auth, majAuth) }),
    el('button', { className: 'sec', textContent: 'Déconnexion', onclick: () => auth.signOut() }));
}
$('#loginForm').onsubmit = e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  const msg = { 'auth/invalid-email': 'Email mal formé', 'auth/invalid-credential': 'Email ou mot de passe incorrect', 'auth/wrong-password': 'Mot de passe incorrect', 'auth/user-not-found': 'Compte inconnu', 'auth/too-many-requests': 'Trop d\'essais, réessaie plus tard' };
  auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value).catch(err => $('#loginErr').textContent = msg[err.code] || err.message);
};
auth.onAuthStateChanged(u => { user = u; majAuth(); });
async function chargerEnLigne() {
  try {
    const d = await DOC.get();
    if (d.exists) { cfg = migrerConfig(JSON.parse(d.data().json)); toast('Version en ligne chargée'); }
    else toast('Rien en ligne : connecte-toi et publie la 1re version');
  } catch (e) { toast('Firebase inaccessible → config.js'); }
  $('#modif').textContent = ''; afficher();
}

// ---------- Actions ----------
$('#bSave').onclick = async () => {
  const json = JSON.stringify(cfg);
  if (json.length > 950000) return alert(`Config trop lourde (${Math.round(json.length / 1024)} Ko, max 1 Mo). Utilise des images plus légères.`);
  try {
    await DOC.set({ json, maj: firebase.firestore.FieldValue.serverTimestamp(), par: user.displayName || user.uid });
    $('#modif').textContent = ''; toast('🚀 Publié ! Le jeu est à jour pour tout le monde');
  } catch (e) { alert('Publication refusée : ' + e.message); }
};
$('#bJouer').onclick = () => open('index.html', '_blank');
$('#bExport').onclick = () => {
  const txt = '// ⚙️ DONNÉES DU JEU — sauvegarde console admin Bastory\nconst CONFIG_PAR_DEFAUT = ' + JSON.stringify(cfg, null, 2) + ';\n\n' + migrerConfig.toString() + '\n';
  el('a', { href: URL.createObjectURL(new Blob([txt], { type: 'text/javascript' })), download: 'config.js' }).click();
  toast('Sauvegarde téléchargée');
};
$('#bImport').onclick = () => $('#fichier').click();
$('#fichier').onchange = async e => {
  try { const t = await e.target.files[0].text(); cfg = migrerConfig(JSON.parse(t.slice(t.indexOf('{'), t.indexOf('};') + 1))); modifie(); afficher(); toast('Importé — pense à publier'); }
  catch (err) { alert('Fichier invalide'); }
};
$('#bReset').onclick = () => { if (confirm('Annuler les modifications non publiées ?')) chargerEnLigne(); };
onbeforeunload = e => { if ($('#modif').textContent) e.preventDefault(); };
afficher(); majAuth(); chargerEnLigne();
</script>
</body>
</html>
